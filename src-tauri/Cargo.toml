[package]
name = "rebased-background-studio"
version = "0.1.1"
description = "A headless Background Studio worker for the Rebased git client."
authors = ["Rebased Background Studio contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[features]
integration-test-pipe = []

[lib]
name = "rebased_background_studio_lib"
path = "src/lib.rs"

[[bin]]
name = "rebased-background-studio"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.20.0", features = ["v4"] }
sha2 = "0.10.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
url = "2.5.8"
reqwest = { version = "0.13.3", default-features = false }
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
zip = { version = "2.4.2", default-features = false }

[dev-dependencies]
zip = { version = "2.4.2", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
